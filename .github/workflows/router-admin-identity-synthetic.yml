name: Auto-Assign Router identity boundary (synthetic)

on:
  pull_request:
    branches: [main]
    paths:
      - src/auto_assign/clients.py
      - tests/test_router_admin_identity_boundary.py
      - .github/workflows/router-admin-identity-synthetic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  router-identity-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source without retained GitHub credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app and pinned synthetic test dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest==8.3.5 pytest-asyncio==0.25.3
      - name: Static compile without starting services
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in ("src/auto_assign/clients.py", "tests/test_router_admin_identity_boundary.py"):
              ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
          PY
      - name: Execute live-code mock-HTTP identity regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m pytest -q -p no:cacheprovider tests/test_router_admin_identity_boundary.py
