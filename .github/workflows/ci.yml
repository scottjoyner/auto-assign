name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Compile
        run: python -m compileall src tests
      - name: Unit and contract tests (no external fleet services)
        run: pytest -q --ignore=tests/integration
      - name: Document separate live integration gate
        if: always()
        run: |
          echo "Live AssistX / Router / Auto-Assign integration was NOT executed in hosted CI." >> "$GITHUB_STEP_SUMMARY"
          echo "The six tests under tests/integration require an independently authorized running stack." >> "$GITHUB_STEP_SUMMARY"
          echo "Do not treat this workflow as live deployment or credential-rotation acceptance." >> "$GITHUB_STEP_SUMMARY"
