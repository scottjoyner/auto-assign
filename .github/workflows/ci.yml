name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Compile
        run: python -m compileall src tests
      - name: Test source and isolated ASGI contracts (NOT live integration)
        env:
          AUTO_ASSIGN_INTEGRATION_MODE: synthetic
          # Synthetic CI requests simulate local clients; never set in production.
          AUTO_ASSIGN_ALLOW_UNAUTHENTICATED_LOCAL_DEV: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m pytest -q -p no:cacheprovider
